    <path d="M80 40 L84 26" fill="none" stroke="#14091f" stroke-width="4"/>
    <circle cx="85" cy="21" r="7" fill="#d9d9e6"/>
    <path d="M81 18 L89 24 M80 22 L88 27 M83 15 L90 20" fill="none" stroke="#14091f" stroke-width="1.2"/>
    <!-- Kopf -->
    <path d="M22 50 C20 30 32 18 48 18 C64 18 76 30 74 50 C72 62 62 66 48 66 C34 66 24 62 22 50 Z" fill="#ff4d6d"/>
    <circle cx="34" cy="30" r="2.4" fill="#ff8fa3" stroke="none"/>
    <circle cx="62" cy="28" r="3" fill="#ff8fa3" stroke="none"/>
    <!-- Krone -->
    <path d="M34 22 L32 8 L40 14 L48 4 L56 14 L64 8 L62 22 Z" fill="#ffd166"/>
    <circle cx="48" cy="12" r="2.2" fill="#38e1ff"/>
