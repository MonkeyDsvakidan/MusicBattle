    <path d="M26 54 C16 54 12 46 14 40" fill="none" stroke="#ff4d6d" stroke-width="6"/>
    <path d="M4 26 L20 24 L22 42 L6 44 Z" fill="#fffbe8"/>
    <path d="M8 31 L18 30 M8 35 L18 34 M8 39 L15 38" fill="none" stroke="#5a6bd8" stroke-width="1.6"/>
    <!-- Arm rechts mit Mikrofon -->
