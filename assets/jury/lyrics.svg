  <defs>
    <radialGradient id="w" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#3fb6e8"/><stop offset="1" stop-color="#14508f"/></radialGradient>
    <filter id="k" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="12"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#w)" stroke="#14091f" stroke-width="3"/>
  <g filter="url(#k)" stroke="#14091f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="20" r="2.6" fill="none" stroke="#e6f8ff" stroke-width="1.5"/>
    <!-- Tentakel unten -->
    <path d="M30 60 C24 70 30 78 22 84 M40 64 C38 74 44 80 38 88 M56 64 C58 74 52 80 58 88 M66 60 C72 70 66 78 74 84" fill="none" stroke="#ff4d6d" stroke-width="6"/>
