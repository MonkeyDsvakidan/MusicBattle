    <ellipse cx="38" cy="42" rx="6" ry="6.5" fill="#ffffff"/>
    <ellipse cx="58" cy="42" rx="6" ry="6.5" fill="#ffffff"/>
    <circle cx="39" cy="44" r="2.6" fill="#14091f"/>
    <circle cx="59" cy="44" r="2.6" fill="#14091f"/>
    <path d="M31.5 40 C34 37 42 37 44.5 40 L44.5 37 C42 34 34 34 31.5 37 Z M51.5 40 C54 37 62 37 64.5 40 L64.5 37 C62 34 54 34 51.5 37 Z" fill="#ff4d6d"/>
