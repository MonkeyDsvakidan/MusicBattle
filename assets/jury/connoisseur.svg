    <path d="M44 66 C40 58 38 52 36 46" fill="none" stroke="#a6d98a" stroke-width="9"/>
    <path d="M44 66 C40 58 38 52 36 46" fill="none" stroke="#14091f" stroke-width="1" stroke-dasharray="2 6"/>
    <path d="M14 38 C14 24 26 18 36 20 C46 22 50 32 46 42 C42 50 30 52 22 50 C16 48 14 44 14 38 Z" fill="#a6d98a"/>
