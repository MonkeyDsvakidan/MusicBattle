    <circle cx="24" cy="34" r="6" fill="#e9fbff"/>
    <circle cx="38" cy="33" r="6" fill="#e9fbff"/>
    <path d="M30 34 L32 33.5 M18 34 L14 32" fill="none"/>
    <circle cx="25" cy="35" r="2.2" fill="#14091f"/>
    <circle cx="39" cy="34" r="2.2" fill="#14091f"/>
