    <circle cx="20" cy="70" r="13" fill="#14091f"/>
    <circle cx="20" cy="70" r="9" fill="none" stroke="#3d2a5e" stroke-width="1.2"/>
    <circle cx="20" cy="70" r="5" fill="#ff3fa4"/>
    <circle cx="20" cy="70" r="1.2" fill="#14091f"/>
    <path d="M12 64 C14 62 16 61 18 61" fill="none" stroke="#6b5a8e" stroke-width="1.4"/>
