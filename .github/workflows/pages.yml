name: Deploy Music Battle to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein laufendes nicht abbrechen (sonst bleibt die Seite evtl. halb aktualisiert)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Hochladen und Veröffentlichen in getrennten Jobs: im selben Job fand deploy-pages das eben hochgeladene
  # Paket manchmal noch nicht («No artifacts named github-pages», 20.11. und 22.11.2026)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
